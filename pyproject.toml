[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imgapi"
version = "0.1.0"
description = "Scrape direct image URLs from Bing, DuckDuckGo, Yandex, and Google"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["image", "search", "scraper", "bing", "duckduckgo", "yandex", "google"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "scrapling[fetchers]>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/predpa01/image-api"
Repository = "https://github.com/predpa01/image-api"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["imgapi"]
